version: '3.8'

services:
  # Servicio de la aplicación Laravel
  app:
    build: .
    volumes:
      - ./api:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
    depends_on:
      - mysql
    deploy:
      replicas: 10  # 10 instancias de la aplicación
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:work", "--tries=1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servicio MySQL
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=laravel
      - MYSQL_USER=laravel
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  # Balanceador de carga Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./api:/var/www
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-network
    deploy:
      replicas: 1

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: 